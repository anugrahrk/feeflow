name: Peekaboo iOS Build
# Note: If the repo has existing GitHub Actions workflows,
# those will also run independently. Only the Peekaboo
# workflow uploads to your preview.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./feeflow-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          env | grep "^PEEKABOO_ENV_" | while IFS='=' read -r key value; do
            clean_key="${key#PEEKABOO_ENV_}"
            echo "$clean_key=$value" >> $GITHUB_ENV
            echo "$clean_key=$value" >> .env
            echo "$clean_key=$value" >> .env.local
            echo "$clean_key=$value" >> .env.production
            echo "$clean_key=$value" >> .env.development
          done
          echo "✓ Environment variables configured"
        working-directory: ./feeflow-mobile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./feeflow-mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli
        working-directory: ./feeflow-mobile

      - name: Expo Prebuild (generates ios/ directory)
        run: |
          CI=1 npx expo prebuild --platform ios --clean
        working-directory: ./feeflow-mobile

      - name: Build for simulator
        run: |
          WORKSPACE=$(find ./ios -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -not -path "*/.git/*" | head -1)

          echo "Found workspace: $WORKSPACE"

          # Get all schemes and pick the one that matches the app name
          # Filter out ALL Expo/React internal schemes
          ALL_SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/,/^$/' \
            | grep -v "Schemes:" \
            | grep -v "^\s*$" \
            | sed 's/^[[:space:]]*//')

          echo "All schemes: $ALL_SCHEMES"

          # Pick first scheme that doesn't match internal patterns
          SCHEME=$(echo "$ALL_SCHEMES" \
            | grep -v "^EX" \
            | grep -v "^Expo" \
            | grep -v "^React" \
            | grep -v "^RN" \
            | grep -v "^hermes" \
            | grep -v "^Pods" \
            | grep -v "Tests$" \
            | grep -v "^flipper" \
            | head -1 \
            | xargs)

          echo "Selected scheme: $SCHEME"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not detect app scheme. Available schemes:"
            echo "$ALL_SCHEMES"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_BUNDLING=NO \
            BUNDLE_REACT_NATIVE_CODE_AND_IMAGES=YES \
            RCT_DEV=0 2>&1 | tail -50

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: xcodebuild failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
        working-directory: ./feeflow-mobile

      - name: Find and zip .app
        run: |
          echo "Searching for .app in build directory..."
          find ./build -name "*.app" -not -name "*.appex" | head -20

          APP=$(find ./build -name "*.app" \
            -not -name "*.appex" \
            -not -path "*/\.*" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found. Full build directory:"
            find ./build -type d | head -50
            exit 1
          fi

          echo "Found app at: $APP"
          zip -r app.zip "$APP"
          echo "Zipped successfully: $(du -sh app.zip)"
        working-directory: ./feeflow-mobile

      - name: Get signed upload URL
        run: |
          RESPONSE=$(curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }}/upload-url \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}')
          echo "SIGNED_URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['signedUrl'])")" >> $GITHUB_ENV
        working-directory: ./feeflow-mobile

      - name: Upload app.zip to Supabase Storage
        run: |
          curl -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app.zip
        working-directory: ./feeflow-mobile

      - name: Notify Peekaboo webhook
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}'
        working-directory: ./feeflow-mobile

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "failed",
              "error": "Build failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        working-directory: ./feeflow-mobile
