name: Peekaboo iOS Build
# Note: If the repo has existing GitHub Actions workflows,
# those will also run independently. Only the Peekaboo
# workflow uploads to your preview.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./feeflow-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          env | grep "^PEEKABOO_ENV_" | while IFS='=' read -r key value; do
            clean_key="${key#PEEKABOO_ENV_}"
            echo "$clean_key=$value" >> $GITHUB_ENV
            echo "$clean_key=$value" >> .env
            echo "$clean_key=$value" >> .env.local
            echo "$clean_key=$value" >> .env.production
            echo "$clean_key=$value" >> .env.development
          done
          echo "✓ Environment variables configured"
        working-directory: ./feeflow-mobile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./feeflow-mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli
        working-directory: ./feeflow-mobile

      - name: Expo Prebuild (generates ios/ directory)
        run: |
          CI=1 npx expo prebuild --platform ios --clean
        working-directory: ./feeflow-mobile

      - name: Build for simulator
        run: |
          WORKSPACE=$(find ./ios -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -not -path "*/.git/*" | head -1)

          echo "Workspace: $WORKSPACE"

          # List ALL schemes for debugging
          echo "=== All available schemes ==="
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null
          echo "==========================="

          # Get the app name from app.json or package.json
          APP_NAME=""
          if [ -f "app.json" ]; then
            APP_NAME=$(python3 -c "
          import json
          with open('app.json') as f:
            data = json.load(f)
          name = data.get('expo', {}).get('name', '') or data.get('name', '')
          print(name.replace(' ', ''))
          " 2>/dev/null || echo "")
          fi

          if [ -z "$APP_NAME" ] && [ -f "package.json" ]; then
            APP_NAME=$(python3 -c "
          import json
          with open('package.json') as f:
            data = json.load(f)
          print(data.get('name', '').replace('-', '').replace('_', '').replace(' ', ''))
          " 2>/dev/null || echo "")
          fi

          echo "Detected app name: $APP_NAME"

          # Try to find scheme matching app name first
          SCHEME=""
          if [ -n "$APP_NAME" ]; then
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
              | awk '/Schemes:/,0' \
              | grep -v "Schemes:" \
              | grep -i "$APP_NAME" \
              | head -1 \
              | xargs)
          fi

          # Fallback — pick first non-internal scheme
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
              | awk '/Schemes:/,0' \
              | grep -v "Schemes:" \
              | grep -v "^\s*$" \
              | sed 's/^[[:space:]]*//' \
              | grep -v "^EX" \
              | grep -v "^Expo" \
              | grep -v "^React" \
              | grep -v "^RN" \
              | grep -v "^RCT" \
              | grep -v "^FB" \
              | grep -v "^hermes" \
              | grep -v "^Pods" \
              | grep -v "^flipper" \
              | grep -v "^yoga" \
              | grep -v "Tests$" \
              | grep -v "^boost" \
              | head -1 \
              | xargs)
          fi

          echo "Selected scheme: $SCHEME"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not detect app scheme"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_BUNDLING=NO \
            BUNDLE_REACT_NATIVE_CODE_AND_IMAGES=YES \
            RCT_DEV=0
        working-directory: ./feeflow-mobile

      - name: Find and zip .app
        run: |
          echo "=== Searching for .app ==="
          find ./build/Build/Products -name "*.app" 2>/dev/null
          echo "=========================="

          # Search specifically in Debug-iphonesimulator first
          APP=$(find ./build/Build/Products/Debug-iphonesimulator \
            -maxdepth 1 \
            -name "*.app" \
            -not -name "*.appex" \
            2>/dev/null | head -1)

          # Fallback — search entire build
          if [ -z "$APP" ]; then
            APP=$(find ./build -name "*.app" \
              -not -name "*.appex" \
              -not -path "*/\.*" \
              2>/dev/null | head -1)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            echo "Contents of Debug-iphonesimulator:"
            ls -la ./build/Build/Products/Debug-iphonesimulator/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

          echo "Found: $APP"
          zip -r app.zip "$APP"
          echo "Size: $(du -sh app.zip)"
        working-directory: ./feeflow-mobile

      - name: Get signed upload URL
        run: |
          RESPONSE=$(curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }}/upload-url \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}')
          echo "SIGNED_URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['signedUrl'])")" >> $GITHUB_ENV
        working-directory: ./feeflow-mobile

      - name: Upload app.zip to Supabase Storage
        run: |
          curl -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app.zip
        working-directory: ./feeflow-mobile

      - name: Notify Peekaboo webhook
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}'
        working-directory: ./feeflow-mobile

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "failed",
              "error": "Build failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        working-directory: ./feeflow-mobile
