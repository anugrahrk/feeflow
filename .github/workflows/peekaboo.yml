name: Peekaboo iOS Build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./feeflow-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          env | grep "^PEEKABOO_ENV_" | while IFS='=' read -r key value; do
            clean_key="${key#PEEKABOO_ENV_}"
            echo "$clean_key=$value" >> $GITHUB_ENV
            echo "$clean_key=$value" >> .env
            echo "$clean_key=$value" >> .env.local
            echo "$clean_key=$value" >> .env.production
            echo "$clean_key=$value" >> .env.development
          done
          echo "✓ Environment variables configured"
        working-directory: ./feeflow-mobile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./feeflow-mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli
        working-directory: ./feeflow-mobile

      - name: Expo Prebuild (generates ios/ directory)
        run: |
          CI=1 npx expo prebuild --platform ios --clean
          WORKSPACE=$(find ./ios -name "*.xcworkspace" -not -path "*/Pods/*" | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/,0' \
            | grep -v "Schemes:" \
            | grep -v "Tests" \
            | grep -v "EX" \
            | grep -v "Pods" \
            | xargs \
            | awk '{print $1}')
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
        working-directory: ./feeflow-mobile

      - name: Bundle JavaScript
        run: |
          npx expo export:embed \
            --platform ios \
            --bundle-output ios/${{ env.SCHEME }}/main.jsbundle \
            --assets-dest ios/${{ env.SCHEME }} \
            --dev false
        working-directory: ./feeflow-mobile

      - name: Build for simulator
        run: |
          WORKSPACE=$(find ./ios -name "*.xcworkspace" -not -path "*/Pods/*" | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/,0' \
            | grep -v "Schemes:" \
            | grep -v "Tests" \
            | grep -v "EX" \
            | grep -v "Pods" \
            | xargs \
            | awk '{print $1}')
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Building: $WORKSPACE scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_BUNDLING=NO \
            BUNDLE_REACT_NATIVE_CODE_AND_IMAGES=YES \
            RCT_DEV=0
        working-directory: ./feeflow-mobile

      - name: Zip .app artifact
        run: |
          APP=$(find ./build -name "*.app" -not -path "*/.*" | grep -v ".appex" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found. Listing build directory:"
            find ./build -type d | head -30
            exit 1
          fi
          echo "Found app at: $APP"
          zip -r app.zip "$APP"
        working-directory: ./feeflow-mobile

      - name: Get signed upload URL
        run: |
          RESPONSE=$(curl -s -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }}/upload-url \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}')
          echo "SIGNED_URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['signedUrl'])")" >> $GITHUB_ENV
        working-directory: ./feeflow-mobile

      - name: Upload app.zip to Supabase Storage
        run: |
          curl -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app.zip
        working-directory: ./feeflow-mobile

      - name: Notify Peekaboo webhook
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id }}"}'
        working-directory: ./feeflow-mobile
